<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مصحفي</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  
:root{--bg:#f5f0e8;--text:#2c1a0e;--accent:#4f7f5a;--panel:#ebe2cc;--border:#c9b99a;--fs:1.9rem}
body.dark{--bg:#1a1a2e;--text:#e8d9c0;--accent:#6aaa7a;--panel:#16213e;--border:#334466}
body.night{--bg:#0d0d0d;--text:#c8a96e;--accent:#c8a96e;--panel:#161208;--border:#3a2e00}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Amiri',serif;transition:background .3s,color .3s}
button,select,input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
#reader{height:100%;overflow-y:auto;padding:28px 18px 48px;display:flex;-webkit-tap-highlight-color:transparent}
#text{max-width:760px;width:100%;margin:auto;font-family:'Amiri Quran','Amiri',serif;font-size:var(--fs);line-height:2.4;text-align:center}
.ayah{cursor:pointer;border-radius:6px}
.ayah.sel{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.ayah.cur{background:color-mix(in srgb,var(--accent) 40%,transparent)}
.num{color:var(--accent);font-size:.7em;margin:0 3px}
.sura{display:block;margin:18px 0 4px;padding:2px;color:var(--accent);border-block:1px solid var(--border)}
.bism{display:block;margin:4px 0 10px}
.msg{padding:40px;opacity:.7}
.bar{position:fixed;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--panel);transition:transform .3s}
#top{top:0;border-bottom:1px solid var(--border);transform:translateY(-100%)}
#bot{bottom:0;border-top:1px solid var(--border);transform:translateY(100%);padding-bottom:calc(10px + env(safe-area-inset-bottom))}
body.menu #top,body.menu #bot{transform:none}
.grp{display:flex;align-items:center;gap:6px}
#lbl{font-size:.95rem;text-align:center;flex:1}
#pg{width:64px;text-align:center}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:62vh;overflow-y:auto;background:var(--panel);border-top:1px solid var(--border);padding:14px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s}
#sheet.open{transform:none}
#sheet .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#sheet small{display:block;margin:12px 0 4px;color:var(--accent)}
#tr,#tf{line-height:1.9}
#tf{font-size:1.15rem}
#drawer{position:fixed;top:0;bottom:0;right:0;z-index:40;width:min(320px,88%);background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s}
#drawer.open{transform:none}
#drawer .set{padding:12px;display:grid;gap:8px;border-bottom:1px solid var(--border)}
#drawer .set select,#drawer .set input{width:100%}
#list{overflow-y:auto;flex:1;list-style:none}
#list li{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer}
#list li:hover{background:var(--bg)}
#list li span:first-child{color:var(--accent);min-width:28px}
#drawer .priv{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);color:var(--accent);font-size:.9rem;text-align:center}

/* ---- page flip ---- */
#text{transition:opacity .2s}
@keyframes flipOut{to{transform:perspective(1500px) rotateY(-70deg) scaleX(.6);opacity:0}}
@keyframes flipOutPrev{to{transform:perspective(1500px) rotateY(70deg) scaleX(.6);opacity:0}}
@keyframes pageInNext{from{transform:perspective(1500px) rotateY(-20deg) scaleX(.9);opacity:.3}to{transform:none;opacity:1}}
@keyframes pageInPrev{from{transform:perspective(1500px) rotateY(20deg) scaleX(.9);opacity:.3}to{transform:none;opacity:1}}
#text{transform-origin:right center}
#text.out-next{animation:flipOut .18s ease-in forwards}
#text.out-prev{animation:flipOutPrev .18s ease-in forwards}
#text.in-next{animation:pageInNext .3s ease-out}
#text.in-prev{animation:pageInPrev .3s ease-out}
@media (prefers-reduced-motion:reduce){#text{animation:none!important}}

/* ---- tajweed colors (only when the switch is on) ---- */
#text tajweed{color:inherit}
body.tj #text tajweed.ham_wasl,body.tj #text tajweed.slnt,body.tj #text tajweed.laam_shamsiyah{color:#9a9a9a}
body.tj #text tajweed.madda_normal{color:#d4571a}
body.tj #text tajweed.madda_permissible{color:#e08a00}
body.tj #text tajweed.madda_necessary,body.tj #text tajweed.madda_obligatory{color:#b3201f}
body.tj #text tajweed.qalaqah{color:#2f6fd0}
body.tj #text tajweed.ikhfa_shafawi,body.tj #text tajweed.ikhfa{color:#c2307a}
body.tj #text tajweed.iqlab{color:#1a9aa0}
body.tj #text tajweed.idgham_ghunnah,body.tj #text tajweed.idgham_wo_ghunnah,body.tj #text tajweed.idgham_shafawi,body.tj #text tajweed.idgham_mutajanisayn,body.tj #text tajweed.idgham_mutaqaribayn{color:#2e9b4d}
body.tj #text tajweed.ghunnah{color:#e0457b}
body.dark.tj #text tajweed.qalaqah{color:#6aa3ff}
body.night.tj #text tajweed.qalaqah{color:#7fb0ff}
#legend{display:none;margin-top:10px;font-size:.9rem;line-height:2}
body.tj #legend.show{display:block}
#legend i{display:inline-block;width:.9em;height:.9em;border-radius:50%;vertical-align:middle;margin-inline:4px 4px}
#ask{margin-top:14px;border-top:1px solid var(--border);padding-top:10px}
#ask .line{display:flex;gap:6px}
#ask input{flex:1;min-width:0}
#ans{margin-top:10px;line-height:1.9;white-space:pre-wrap}
#ans.err{color:#b3201f}
#ask small.note{display:block;margin-top:8px;opacity:.7;color:inherit}
#ab:disabled{opacity:.5;cursor:wait}
.mic.on{background:var(--accent);color:var(--bg);border-color:var(--accent);animation:micPulse 1.1s ease-in-out infinite}
@keyframes micPulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 30%,transparent)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
#vp{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;margin:auto;max-width:560px;z-index:50;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px 12px 44px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#vp.show{display:block}
#vp .x{position:absolute;z-index:1;top:8px;left:8px;padding:2px 9px}
#vp .you{opacity:.7;font-size:.95rem;min-height:1.2em}
#vp .bot{margin-top:6px;line-height:1.9;white-space:pre-wrap}
#vp.err .bot{color:#b3201f}
</style>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body class="light">

<main id="reader"><div id="text"><div class="msg">…</div></div></main>

<header class="bar" id="top">
  <button id="openList" title="السور">☰</button>
  <span id="lbl"></span>
  <span class="grp">
    <button id="fMinus">A−</button><button id="fPlus">A+</button><button id="theme">◐</button>
  </span>
</header>

<footer class="bar" id="bot">
  <span class="grp">
    <button id="prev" title="الصفحة السابقة">▶</button>
    <input id="pg" type="number" min="1" max="604">
    <button id="next" title="الصفحة التالية">◀</button>
  </span>
  <span class="grp">
    <button id="play" title="تشغيل">▶</button><button id="stop" title="إيقاف">■</button>
    <button class="mic" id="micBar" title="تحدث">🎤</button><button id="vl" title="لغة الصوت">ع</button>
  </span>
</footer>

<section id="sheet">
  <div class="row"><b id="ref"></b>
    <span class="grp"><button class="mic" id="micSheet" title="تحدث">🎤</button><button id="sp">▶ استمع من هنا</button><button id="sx">✕</button></span>
  </div>
  <div id="tr"></div>
  <small>التفسير الميسر</small>
  <div id="tf"></div>
  <div id="ask">
    <small>اسأل عن هذه الآية</small>
    <div class="line">
      <input id="aq" maxlength="300" placeholder="اكتب سؤالك عن هذه الآية...">
      <button id="ab">اسأل</button>
    </div>
    <div id="ans"></div>
    <small class="note">إجابة آلية مبنية على تفسير الميسر فقط، وقد تخطئ. للفتاوى راجع أهل العلم.</small>
  </div>
</section>

<div id="vp" role="status" aria-live="polite"><button class="x" id="vx" title="إغلاق">✕</button><div class="you" id="vyou"></div><div class="bot" id="vbot"></div></div>

<aside id="drawer">
  <div class="set">
    <button id="closeList">✕ إغلاق</button>
    <select id="trSel">
      <option value="en.sahih">English</option>
      <option value="fr.hamidullah">Français</option>
      <option value="ur.jalandhry">اردو</option>
      <option value="tr.diyanet">Türkçe</option>
      <option value="none">بدون ترجمة</option>
    </select>
    <select id="rec">
      <option value="ar.alafasy" data-br="128">مشاري العفاسي</option>
      <option value="ar.husary" data-br="128">الحصري</option>
      <option value="ar.minshawi" data-br="128">المنشاوي</option>
      <option value="ar.abdulbasitmurattal" data-br="64">عبد الباسط</option>
      <option value="ar.abdurrahmaansudais" data-br="64">السديس</option>
    </select>
    <button id="tjBtn" aria-pressed="false">التجويد: إيقاف</button>
    <button id="lgBtn" style="display:none">دليل الألوان</button>
    <div id="legend">
      <div><i style="background:#d4571a"></i>مد طبيعي</div>
      <div><i style="background:#e08a00"></i>مد جائز</div>
      <div><i style="background:#b3201f"></i>مد لازم / واجب</div>
      <div><i style="background:#2f6fd0"></i>قلقلة</div>
      <div><i style="background:#c2307a"></i>إخفاء</div>
      <div><i style="background:#1a9aa0"></i>إقلاب</div>
      <div><i style="background:#2e9b4d"></i>إدغام</div>
      <div><i style="background:#e0457b"></i>غنة</div>
      <div><i style="background:#9a9a9a"></i>لا يُنطق</div>
    </div>
    <input id="q" placeholder="ابحث عن سورة...">
  </div>
  <ul id="list"></ul>
  <a class="priv" href="/privacy.html">سياسة الخصوصية · Privacy</a>
</aside>

<script src="/app.js" defer></script>
</body>
</html>
