<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مصحفي</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  
:root{--bg:#f5f0e8;--text:#2c1a0e;--accent:#4f7f5a;--panel:#ebe2cc;--border:#c9b99a;--fs:1.9rem}
body.dark{--bg:#1a1a2e;--text:#e8d9c0;--accent:#6aaa7a;--panel:#16213e;--border:#334466}
body.night{--bg:#0d0d0d;--text:#c8a96e;--accent:#c8a96e;--panel:#161208;--border:#3a2e00}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Amiri',serif;transition:background .3s,color .3s}
button,select,input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
#reader{height:100%;overflow-y:auto;padding:28px 18px 48px;display:flex;-webkit-tap-highlight-color:transparent}
#text{max-width:760px;width:100%;margin:auto;font-family:'Amiri Quran','Amiri',serif;font-size:var(--fs);line-height:2.4;text-align:center}
.ayah{cursor:pointer;border-radius:6px}
.ayah.sel{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.ayah.cur{background:color-mix(in srgb,var(--accent) 40%,transparent)}
.num{color:var(--accent);font-size:.7em;margin:0 3px}
.sura{display:block;margin:18px 0 4px;padding:2px;color:var(--accent);border-block:1px solid var(--border)}
.bism{display:block;margin:4px 0 10px}
.msg{padding:40px;opacity:.7}
.bar{position:fixed;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--panel);transition:transform .3s}
#top{top:0;border-bottom:1px solid var(--border);transform:translateY(-100%)}
#bot{bottom:0;border-top:1px solid var(--border);transform:translateY(100%);padding-bottom:calc(10px + env(safe-area-inset-bottom))}
body.menu #top,body.menu #bot{transform:none}
.grp{display:flex;align-items:center;gap:6px}
#lbl{font-size:.95rem;text-align:center;flex:1}
#pg{width:64px;text-align:center}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:62vh;overflow-y:auto;background:var(--panel);border-top:1px solid var(--border);padding:14px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s}
#sheet.open{transform:none}
#sheet .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#sheet small{display:block;margin:12px 0 4px;color:var(--accent)}
#tr,#tf{line-height:1.9}
#tf{font-size:1.15rem}
#drawer{position:fixed;top:0;bottom:0;right:0;z-index:40;width:min(320px,88%);background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s}
#drawer.open{transform:none}
#drawer .set{padding:12px;display:grid;gap:8px;border-bottom:1px solid var(--border)}
#drawer .set select,#drawer .set input{width:100%}
#list{overflow-y:auto;flex:1;list-style:none}
#list li{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer}
#list li:hover{background:var(--bg)}
#list li span:first-child{color:var(--accent);min-width:28px}

/* ---- page flip ---- */
#text{transition:opacity .2s}
@keyframes flipOut{to{transform:perspective(1500px) rotateY(-70deg) scaleX(.6);opacity:0}}
@keyframes flipOutPrev{to{transform:perspective(1500px) rotateY(70deg) scaleX(.6);opacity:0}}
@keyframes pageInNext{from{transform:perspective(1500px) rotateY(-20deg) scaleX(.9);opacity:.3}to{transform:none;opacity:1}}
@keyframes pageInPrev{from{transform:perspective(1500px) rotateY(20deg) scaleX(.9);opacity:.3}to{transform:none;opacity:1}}
#text{transform-origin:right center}
#text.out-next{animation:flipOut .18s ease-in forwards}
#text.out-prev{animation:flipOutPrev .18s ease-in forwards}
#text.in-next{animation:pageInNext .3s ease-out}
#text.in-prev{animation:pageInPrev .3s ease-out}
@media (prefers-reduced-motion:reduce){#text{animation:none!important}}

/* ---- tajweed colors (only when the switch is on) ---- */
#text tajweed{color:inherit}
body.tj #text tajweed.ham_wasl,body.tj #text tajweed.slnt,body.tj #text tajweed.laam_shamsiyah{color:#9a9a9a}
body.tj #text tajweed.madda_normal{color:#d4571a}
body.tj #text tajweed.madda_permissible{color:#e08a00}
body.tj #text tajweed.madda_necessary,body.tj #text tajweed.madda_obligatory{color:#b3201f}
body.tj #text tajweed.qalaqah{color:#2f6fd0}
body.tj #text tajweed.ikhfa_shafawi,body.tj #text tajweed.ikhfa{color:#c2307a}
body.tj #text tajweed.iqlab{color:#1a9aa0}
body.tj #text tajweed.idgham_ghunnah,body.tj #text tajweed.idgham_wo_ghunnah,body.tj #text tajweed.idgham_shafawi,body.tj #text tajweed.idgham_mutajanisayn,body.tj #text tajweed.idgham_mutaqaribayn{color:#2e9b4d}
body.tj #text tajweed.ghunnah{color:#e0457b}
body.dark.tj #text tajweed.qalaqah{color:#6aa3ff}
body.night.tj #text tajweed.qalaqah{color:#7fb0ff}
#legend{display:none;margin-top:10px;font-size:.9rem;line-height:2}
body.tj #legend.show{display:block}
#legend i{display:inline-block;width:.9em;height:.9em;border-radius:50%;vertical-align:middle;margin-inline:4px 4px}
#ask{margin-top:14px;border-top:1px solid var(--border);padding-top:10px}
#ask .line{display:flex;gap:6px}
#ask input{flex:1;min-width:0}
#ans{margin-top:10px;line-height:1.9;white-space:pre-wrap}
#ans.err{color:#b3201f}
#ask small.note{display:block;margin-top:8px;opacity:.7;color:inherit}
#ab:disabled{opacity:.5;cursor:wait}
.mic.on{background:var(--accent);color:var(--bg);border-color:var(--accent);animation:micPulse 1.1s ease-in-out infinite}
@keyframes micPulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 30%,transparent)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
#vp{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;margin:auto;max-width:560px;z-index:50;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px 12px 44px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#vp.show{display:block}
#vp .x{position:absolute;z-index:1;top:8px;left:8px;padding:2px 9px}
#vp .you{opacity:.7;font-size:.95rem;min-height:1.2em}
#vp .bot{margin-top:6px;line-height:1.9;white-space:pre-wrap}
#vp.err .bot{color:#b3201f}
</style>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body class="light">

<main id="reader"><div id="text"><div class="msg">…</div></div></main>

<header class="bar" id="top">
  <button id="openList" title="السور">☰</button>
  <span id="lbl"></span>
  <span class="grp">
    <button id="fMinus">A−</button><button id="fPlus">A+</button><button id="theme">◐</button>
  </span>
</header>

<footer class="bar" id="bot">
  <span class="grp">
    <button id="prev" title="الصفحة السابقة">▶</button>
    <input id="pg" type="number" min="1" max="604">
    <button id="next" title="الصفحة التالية">◀</button>
  </span>
  <span class="grp">
    <button id="play" title="تشغيل">▶</button><button id="stop" title="إيقاف">■</button>
    <button class="mic" id="micBar" title="تحدث">🎤</button><button id="vl" title="لغة الصوت">ع</button>
  </span>
</footer>

<section id="sheet">
  <div class="row"><b id="ref"></b>
    <span class="grp"><button class="mic" id="micSheet" title="تحدث">🎤</button><button id="sp">▶ استمع من هنا</button><button id="sx">✕</button></span>
  </div>
  <div id="tr"></div>
  <small>التفسير الميسر</small>
  <div id="tf"></div>
  <div id="ask">
    <small>اسأل عن هذه الآية</small>
    <div class="line">
      <input id="aq" maxlength="300" placeholder="اكتب سؤالك عن هذه الآية...">
      <button id="ab">اسأل</button>
    </div>
    <div id="ans"></div>
    <small class="note">إجابة آلية مبنية على تفسير الميسر فقط، وقد تخطئ. للفتاوى راجع أهل العلم.</small>
  </div>
</section>

<div id="vp" role="status" aria-live="polite"><button class="x" id="vx" title="إغلاق">✕</button><div class="you" id="vyou"></div><div class="bot" id="vbot"></div></div>

<aside id="drawer">
  <div class="set">
    <button id="closeList">✕ إغلاق</button>
    <select id="trSel">
      <option value="en.sahih">English</option>
      <option value="fr.hamidullah">Français</option>
      <option value="ur.jalandhry">اردو</option>
      <option value="tr.diyanet">Türkçe</option>
      <option value="none">بدون ترجمة</option>
    </select>
    <select id="rec">
      <option value="ar.alafasy" data-br="128">مشاري العفاسي</option>
      <option value="ar.husary" data-br="128">الحصري</option>
      <option value="ar.minshawi" data-br="128">المنشاوي</option>
      <option value="ar.abdulbasitmurattal" data-br="64">عبد الباسط</option>
      <option value="ar.abdurrahmaansudais" data-br="64">السديس</option>
    </select>
    <button id="tjBtn" aria-pressed="false">التجويد: إيقاف</button>
    <button id="lgBtn" style="display:none">دليل الألوان</button>
    <div id="legend">
      <div><i style="background:#d4571a"></i>مد طبيعي</div>
      <div><i style="background:#e08a00"></i>مد جائز</div>
      <div><i style="background:#b3201f"></i>مد لازم / واجب</div>
      <div><i style="background:#2f6fd0"></i>قلقلة</div>
      <div><i style="background:#c2307a"></i>إخفاء</div>
      <div><i style="background:#1a9aa0"></i>إقلاب</div>
      <div><i style="background:#2e9b4d"></i>إدغام</div>
      <div><i style="background:#e0457b"></i>غنة</div>
      <div><i style="background:#9a9a9a"></i>لا يُنطق</div>
    </div>
    <input id="q" placeholder="ابحث عن سورة...">
  </div>
  <ul id="list"></ul>
</aside>

<script>
const API = 'https://api.alquran.cloud/v1/';
const $ = id => document.getElementById(id);
const S = { page: 1, ayahs: [], sel: -1, loadId: 0, audio: null, surahs: null };
const cache = {};
const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};
// Number shown on screen: in Al-Fatihah the Bismillah is an unnumbered heading, so verses shift down by one.
const shownNo = a => a.surah.number === 1 ? a.numberInSurah - 1 : a.numberInSurah;
const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

// One request per page+edition, cached, so going back and forth is instant.
function get(key, url) {
  if (!cache[key]) {
    cache[key] = fetch(url).then(r => r.json()).then(d => {
      if (d.status !== 'OK') throw new Error('bad');
      return d.data.ayahs;
    }).catch(e => { delete cache[key]; throw e; });
  }
  return cache[key];
}
const quran = p => get('q' + p, API + 'page/' + p + '/quran-uthmani');
// Tajweed text comes from Quran.com (HTML tags per rule). Keyed by page + ayah number in surah.
const tjCache = {};
function tajweed(p) {
  if (!tjCache[p]) {
    tjCache[p] = fetch('https://api.quran.com/api/v4/verses/by_page/' + p + '?words=false&per_page=300&fields=text_uthmani_tajweed')
      .then(r => r.json()).then(d => {
        const m = {};
        d.verses.forEach(v => {
          // keep only <tajweed class=...> tags; drop the end-of-ayah span (we draw our own number)
          m[v.verse_key] = v.text_uthmani_tajweed
            .replace(/<span class=end>.*?<\/span>/g, '')
            .replace(/<tajweed class=([a-z_]+)>/g, '<tajweed class="$1">')
            .trim();
        });
        return m;
      }).catch(e => { delete tjCache[p]; throw e; });
  }
  return tjCache[p];
}
const extra = (p, ed) => get(ed + p, API + 'page/' + p + '/' + ed);

// ---------- Page loading ----------
async function loadPage(p, opts = {}) {
  p = Math.max(1, Math.min(604, p));
  const dir = p >= S.page ? 'next' : 'prev';
  const id = ++S.loadId;          // newest request wins, so fast clicks never mix pages
  stopAudio();
  let ayahs, tj = null;
  try {
    ayahs = await quran(p);
    if (document.body.classList.contains('tj')) { try { tj = await tajweed(p); } catch (e) { tj = null; } }
  }
  catch (e) { if (id === S.loadId) $('text').innerHTML = '<div class="msg">⚠️ تعذّر التحميل. تحقق من الإنترنت.</div>'; return; }
  if (id !== S.loadId) return;

  S.page = p; S.ayahs = ayahs; S.sel = -1;
  let h = '';
  ayahs.forEach((a, i) => {
    const n = a.surah.number;
    const first = a.numberInSurah === 1;
    // Plain text, or the tajweed-tagged text for this same ayah when the switch is on.
    let t = (tj && tj[n + ':' + a.numberInSurah]) || a.text;
    // Al-Fatihah: ayah 1 IS the Bismillah. Show it only as the (unnumbered) heading.
    // It keeps data-i so audio, highlighting and tap still work; numbering below shifts by one.
    if (n === 1 && a.numberInSurah === 1) {
      h += `<span class="sura">${a.surah.name}</span>`;
      h += `<span class="bism ayah" data-i="${i}">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</span>`;
      return;
    }
    if (first) {
      h += `<span class="sura">${a.surah.name}</span>`;
      // The Bismillah is ALWAYS shown as a heading, in the same place for every surah
      // (including Al-Fatihah), except At-Tawbah (surah 9) which has none.
      if (n !== 9) h += `<span class="bism">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</span>`;
      // Remove the Bismillah from the start of ayah 1 so it is not shown twice.
      // Works for plain text and for tajweed text (words may be wrapped in tags).
      if (n !== 9) {
        const words = t.split(/ (?![^<]*>)/);          // split on spaces that are not inside a tag
        const clean = w => w.replace(/<[^>]*>/g, '')
          .replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, '')
          .replace(/[\u0671\u0622\u0623\u0625]/g, '\u0627');
        if (words.length > 4 && clean(words[0]) === '\u0628\u0633\u0645' && clean(words[1]) === '\u0627\u0644\u0644\u0647') {
          t = words.slice(4).join(' ');
        }
      }
    }
    h += `<span class="ayah" data-i="${i}">${t}<span class="num">﴿${ar(shownNo(a))}﴾</span></span> `;
  });
  const box = $('text');
  box.className = '';
  box.innerHTML = h;
  $('reader').scrollTop = 0;
  if (!opts.noAnim && !matchMedia('(prefers-reduced-motion:reduce)').matches) {
    void box.offsetWidth;                 // restart the animation
    box.className = 'in-' + dir;
  }
  $('pg').value = p;
  $('lbl').textContent = `${ayahs[0].surah.name} · الجزء ${ar(ayahs[0].juz)} · صفحة ${ar(p)}`;
  closeSheet();
  store.set('lastPage', p);
  if (p < 604) quran(p + 1).catch(() => {});   // preload neighbours
  if (p > 1) quran(p - 1).catch(() => {});
  if (opts.play) playFrom(0);
}
const go = d => loadPage(S.page + d);

// ---------- Tap handling ----------
$('reader').addEventListener('click', e => {
  const a = e.target.closest('.ayah');
  closeList();
  if (a) return selectAyah(+a.dataset.i);
  if ($('sheet').classList.contains('open')) return closeSheet();
  document.body.classList.toggle('menu');
});

function selectAyah(i) {
  S.sel = i;
  document.querySelectorAll('.ayah.sel').forEach(e => e.classList.remove('sel'));
  document.querySelector(`.ayah[data-i="${i}"]`).classList.add('sel');
  const a = S.ayahs[i];
  $('ref').textContent = a.surah.number === 1 && a.numberInSurah === 1 ? `${a.surah.name} · البسملة` : `${a.surah.name} ﴿${ar(shownNo(a))}﴾`;
  $('sheet').classList.add('open');
  $('ans').textContent = ''; $('aq').value = '';
  fill(i);
}
function closeSheet() {
  $('sheet').classList.remove('open');
  document.querySelectorAll('.ayah.sel').forEach(e => e.classList.remove('sel'));
  S.sel = -1;
}
async function fill(i) {
  const p = S.page, ed = $('trSel').value;
  $('tr').textContent = ed === 'none' ? '' : '…';
  $('tr').dir = ed === 'ur.jalandhry' ? 'rtl' : 'ltr';
  $('tf').textContent = '…';
  const put = async (el, edition) => {
    try { const x = await extra(p, edition); if (S.page === p && S.sel === i) el.textContent = x[i].text; }
    catch (e) { if (S.page === p && S.sel === i) el.textContent = '—'; }
  };
  if (ed !== 'none') put($('tr'), ed);
  put($('tf'), 'ar.muyassar');
}

// ---------- Audio (one file per ayah, by its global ayah number) ----------
function stopAudio() {
  const a = S.audio; S.audio = null;
  if (a) { a.onended = a.onerror = null; a.pause(); a.removeAttribute('src'); a.load(); }
  $('play').textContent = '▶';
  document.querySelectorAll('.ayah.cur').forEach(e => e.classList.remove('cur'));
}
function playFrom(i) {
  stopAudio();
  if (i >= S.ayahs.length) { if (S.page < 604) loadPage(S.page + 1, { play: true }); return; }
  const a = S.ayahs[i];
  const sel = $('rec');
  const br = sel.options[sel.selectedIndex].dataset.br || '128';
  const au = new Audio(`https://cdn.islamic.network/quran/audio/${br}/${sel.value}/${a.number}.mp3`);
  S.audio = au;
  $('play').textContent = '⏸';
  const el = document.querySelector(`.ayah[data-i="${i}"]`);
  el.classList.add('cur');
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  au.onended = () => playFrom(i + 1);
  au.onerror = stopAudio;            // stop instead of silently skipping to the wrong ayah
  au.play().catch(stopAudio);
}
function togglePlay() {
  const a = S.audio;
  if (a) {
    if (a.paused) { a.play(); $('play').textContent = '⏸'; }
    else { a.pause(); $('play').textContent = '▶'; }
    return;
  }
  playFrom(S.sel >= 0 ? S.sel : 0);
}
$('play').onclick = togglePlay;
$('stop').onclick = stopAudio;
$('sp').onclick = () => { const i = S.sel; closeSheet(); playFrom(i); };
$('sx').onclick = closeSheet;

// ---------- Navigation ----------
$('next').onclick = () => go(1);
$('prev').onclick = () => go(-1);
$('pg').onchange = () => loadPage(parseInt($('pg').value) || S.page);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') go(1);
  if (e.key === 'ArrowRight') go(-1);
});
let tx = 0, ty = 0;   // swipe right = next page (Arabic reads right to left)
$('reader').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$('reader').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) go(dx > 0 ? 1 : -1);
}, { passive: true });

// ---------- Surah list ----------
function renderList() {
  const q = $('q').value.trim().toLowerCase();
  $('list').innerHTML = S.surahs.filter(s =>
    s.name.includes(q) || s.englishName.toLowerCase().includes(q) || String(s.number) === q
  ).map(s => `<li data-n="${s.number}"><span>${ar(s.number)}</span><span>${s.name}<br><small>${s.englishName} · ${ar(s.numberOfAyahs)}</small></span></li>`).join('');
}
async function openList() {
  $('drawer').classList.add('open');
  if (!S.surahs) {
    try { S.surahs = (await (await fetch(API + 'surah')).json()).data; renderList(); }
    catch (e) { $('list').innerHTML = '<li>⚠️ تعذّر التحميل</li>'; }
  }
}
function closeList() { $('drawer').classList.remove('open'); }
$('openList').onclick = openList;
$('closeList').onclick = closeList;
$('q').oninput = () => S.surahs && renderList();
$('list').onclick = async e => {
  const li = e.target.closest('li'); if (!li) return;
  closeList();
  try {
    const d = await (await fetch(API + 'ayah/' + li.dataset.n + ':1')).json();
    loadPage(d.data.page);
  } catch (err) {}
};
$('trSel').onchange = () => { store.set('tr', $('trSel').value); if (S.sel >= 0) fill(S.sel); };
$('rec').onchange = () => { store.set('rec', $('rec').value); };

// ---------- Tajweed switch ----------
function setTajweed(on) {
  document.body.classList.toggle('tj', on);
  $('tjBtn').textContent = 'التجويد: ' + (on ? 'تشغيل' : 'إيقاف');
  $('tjBtn').setAttribute('aria-pressed', on);
  $('lgBtn').style.display = on ? '' : 'none';
  $('legend').classList.toggle('show', on && $('legend').dataset.open === '1');
  store.set('tj', on ? '1' : '0');
}
$('tjBtn').onclick = () => {
  const on = !document.body.classList.contains('tj');
  setTajweed(on);
  loadPage(S.page, { noAnim: true });     // reload same page with / without tajweed text
};
$('lgBtn').onclick = () => {
  const l = $('legend');
  l.dataset.open = l.dataset.open === '1' ? '0' : '1';
  l.classList.toggle('show', l.dataset.open === '1');
};

// ---------- Theme & font ----------
const themes = ['light', 'dark', 'night'];
function setTheme(t) {
  const keep = ['menu', 'tj'].filter(c => document.body.classList.contains(c));
  document.body.className = [t, ...keep].join(' ');
  store.set('theme', t);
}
$('theme').onclick = () => {
  const cur = themes.find(t => document.body.classList.contains(t)) || 'light';
  setTheme(themes[(themes.indexOf(cur) + 1) % 3]);
};
let fs = parseFloat(store.get('fs')) || 1.9;
function setFont(v) {
  fs = Math.max(1.2, Math.min(3.5, +v.toFixed(1)));
  document.documentElement.style.setProperty('--fs', fs + 'rem');
  store.set('fs', fs);
}
$('fMinus').onclick = () => setFont(fs - 0.1);
$('fPlus').onclick = () => setFont(fs + 0.1);

// ---------- Start ----------
setTheme(store.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
setFont(fs);
if (store.get('tr')) $('trSel').value = store.get('tr');
if (store.get('rec')) $('rec').value = store.get('rec');
if (!$('rec').value) $('rec').selectedIndex = 0;
setTajweed(store.get('tj') === '1');
loadPage(parseInt(store.get('lastPage')) || 1, { noAnim: true });

// ---------- Ask the assistant (typed box + voice share one endpoint) ----------
async function askServer(q, useAyah) {
  const body = { question: q, state: { page: S.page, surah: S.ayahs[0] ? S.ayahs[0].surah.number : null } };
  if (useAyah && S.sel >= 0) { const a = S.ayahs[S.sel]; body.surah = a.surah.number; body.ayah = a.numberInSurah; }
  let r, d;
  try {
    r = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    d = await r.json();
  } catch (e) { throw new Error('تعذّر الاتصال. تحقق من الإنترنت.'); }
  if (!r.ok) throw new Error(d.error || 'حدث خطأ.');
  return d;
}

// The server only ever sends an action from a fixed, validated list. Anything else is ignored here too.
async function runAction(d) {
  const say = d.answer || '';
  switch (d.action) {
    case 'goto_surah': {
      const x = await (await fetch(API + 'ayah/' + d.value + ':1')).json();
      await loadPage(x.data.page); break;
    }
    case 'goto_page': await loadPage(d.value); break;
    case 'next_page': await go(1); break;
    case 'prev_page': await go(-1); break;
    case 'tajweed': setTajweed(!!d.value); await loadPage(S.page, { noAnim: true }); break;
    case 'reciter': $('rec').value = d.value; store.set('rec', d.value); break;
    case 'translation': $('trSel').value = d.value; store.set('tr', d.value); if (S.sel >= 0) fill(S.sel); break;
    case 'theme': setTheme(d.value); break;
    case 'font': setFont(fs + (d.value === 'up' ? 0.2 : -0.2)); break;
    case 'play': if (S.audio && S.audio.paused) togglePlay(); else if (!S.audio) playFrom(S.sel >= 0 ? S.sel : 0); break;
    case 'stop': stopAudio(); break;
    default: break;            // "answer": nothing to do on the page
  }
  return say || 'تم.';
}

async function askAI() {
  const i = S.sel; if (i < 0) return;
  const q = $('aq').value.trim(); if (!q) return;
  $('ab').disabled = true; $('ans').className = ''; $('ans').textContent = '…';
  try {
    const d = await askServer(q, true);
    const msg = await runAction(d);
    if (S.sel === i) $('ans').textContent = msg;
  } catch (e) {
    if (S.sel === i) { $('ans').className = 'err'; $('ans').textContent = e.message || 'حدث خطأ.'; }
  }
  $('ab').disabled = false;
}
$('ab').onclick = askAI;
$('aq').addEventListener('keydown', e => { if (e.key === 'Enter') askAI(); });

// ---------- Voice assistant ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let vlang = store.get('vlang') === 'en-US' ? 'en-US' : 'ar-SA';
let recog = null, listening = false;
const setMic = on => document.querySelectorAll('.mic').forEach(b => b.classList.toggle('on', on));
function showVoice(you, bot, isErr) {
  $('vyou').textContent = you || '';
  $('vbot').textContent = bot || '';
  $('vp').classList.toggle('err', !!isErr);
  $('vp').classList.add('show');
}
function speak(t) {
  if (!('speechSynthesis' in window) || !t) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = /[\u0600-\u06FF]/.test(t) ? 'ar-SA' : 'en-US';
  speechSynthesis.speak(u);
}
async function handleVoice(text) {
  showVoice(text, '…');
  try {
    const d = await askServer(text, S.sel >= 0);
    const msg = await runAction(d);
    showVoice(text, msg); speak(msg);
  } catch (e) { showVoice(text, e.message || 'تعذّر الاتصال.', true); }
}
function startVoice() {
  if (!SR) return showVoice('', 'المتصفح لا يدعم الأوامر الصوتية. جرّب Chrome أو Edge.', true);
  if (listening) { try { recog.stop(); } catch (e) {} return; }
  if (S.audio && !S.audio.paused) { S.audio.pause(); $('play').textContent = '▶'; }   // so the recitation is not heard as speech
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  recog = new SR();
  recog.lang = vlang; recog.interimResults = true; recog.continuous = false; recog.maxAlternatives = 1;
  let heard = '';
  recog.onstart = () => { listening = true; setMic(true); showVoice('', vlang === 'ar-SA' ? 'أستمع إليك…' : 'Listening…'); };
  recog.onresult = e => { heard = Array.from(e.results).map(r => r[0].transcript).join(' ').trim(); $('vyou').textContent = heard; };
  recog.onerror = e => {
    heard = '';
    const msg = e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'اسمح للمتصفح باستخدام الميكروفون.'
      : e.error === 'no-speech' ? 'لم أسمع شيئًا. حاول مرة أخرى.' : 'تعذّر الاستماع. حاول مرة أخرى.';
    showVoice('', msg, true);
  };
  recog.onend = () => { listening = false; setMic(false); if (heard) handleVoice(heard); };
  try { recog.start(); } catch (e) { showVoice('', 'تعذّر تشغيل الميكروفون.', true); }
}
document.querySelectorAll('.mic').forEach(b => b.onclick = e => { e.stopPropagation(); startVoice(); });
$('vl').textContent = vlang === 'ar-SA' ? 'ع' : 'EN';
$('vl').onclick = () => { vlang = vlang === 'ar-SA' ? 'en-US' : 'ar-SA'; store.set('vlang', vlang); $('vl').textContent = vlang === 'ar-SA' ? 'ع' : 'EN'; };
$('vx').onclick = () => {
  $('vp').classList.remove('show');
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (listening) { try { recog.stop(); } catch (e) {} }
};

// ---------- Offline / install ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
}
</script>
